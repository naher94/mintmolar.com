media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{fields.slug}"
    fields:
      - name: title
        label: Title
        type: string
      - name: slug
        label: Slug
        type: string
        description: "Used in the filename and permalink e.g. new-name-same-great-care"
      - name: date
        label: Date
        type: date
      - name: permalink
        label: Permalink
        type: string
        description: "e.g. /post/my-post-slug"
      - name: body
        label: Content
        type: rich-text

  - name: contact
    label: Contact
    type: file
    path: _data/contact.yml
    fields:
      - name: phone
        label: Phone (display)
        type: string
      - name: phone_link
        label: "Phone (digits only, for tel links)"
        type: string
      - name: email
        label: Email
        type: string
      - name: address
        label: Address
        type: object
        fields:
          - name: street
            label: Street
            type: string
          - name: city
            label: City
            type: string
          - name: state
            label: State
            type: string
          - name: zip
            label: ZIP Code
            type: string
          - name: maps_url
            label: Google Maps URL
            type: string

  - name: hours
    label: Hours
    type: file
    path: _data/hours.yml
    list: true
    fields:
      - name: day
        label: Day
        type: string
        readonly: true
      - name: abbr
        label: Abbreviation
        type: string
        hidden: true
      - name: time
        label: Hours
        type: string
        description: "e.g. 8am - 5pm or Closed"

  - name: team
    label: Team
    type: collection
    path: _team
    fields:
      - name: name
        label: Name
        type: string
      - name: title
        label: Title
        type: string
        description: "e.g. Family Dentist DDS, Front Desk"
      - name: role
        label: Role
        type: select
        options:
          values:
            - doctor
            - staff
      - name: order
        label: Order
        type: number
      - name: photo
        label: Photo
        type: image
      - name: bio
        label: Bio
        type: text
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: degree
            label: Degree
            type: string
          - name: institution
            label: Institution
            type: string
      - name: languages
        label: Languages
        type: string
        list: true

  - name: services
    label: Services
    type: collection
    path: _services
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: text
      - name: order
        label: Order
        type: number

  - name: holidays
    label: Holiday Closures
    type: file
    path: _data/holidays.yml
    list: true
    fields:
      - name: holiday
        label: Holiday Name
        type: string
        description: "e.g. Thanksgiving, Christmas Day"
      - name: date
        label: Date
        type: date
      - name: message
        label: Banner Message
        type: string
        description: "Shown in the site banner"

  - name: legal
    label: Legal
    type: group
    items:
      - name: privacy-policy
        label: Privacy Policy
        type: file
        path: legal/privacy-policy.md
        fields:
          - name: title
            label: Title
            type: string
          - name: body
            label: Content
            type: rich-text
      - name: notice-of-privacy-practices
        label: Notice of Privacy Practices
        type: file
        path: legal/notice-of-privacy-practices.md
        fields:
          - name: title
            label: Title
            type: string
          - name: body
            label: Content
            type: rich-text
      - name: terms-of-use
        label: Terms of Use
        type: file
        path: legal/terms-of-use.md
        fields:
          - name: title
            label: Title
            type: string
          - name: body
            label: Content
            type: rich-text
      - name: notice-of-non-discrimination
        label: Notice of Non-Discrimination
        type: file
        path: legal/notice-of-non-discrimination.md
        fields:
          - name: title
            label: Title
            type: string
          - name: body
            label: Content
            type: rich-text
      - name: accessibility
        label: Accessibility
        type: file
        path: legal/accessibility.md
        fields:
          - name: title
            label: Title
            type: string
          - name: body
            label: Content
            type: rich-text
