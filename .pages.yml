media:
  input: assets/images
  output: /assets/images

content:
  - name: contact
    label: Contact
    type: file
    path: _data/contact.yml
    fields:
      - name: phone
        label: Phone (display)
        type: string
      - name: phone_link
        label: "Phone (digits only, for tel links)"
        type: string
      - name: email
        label: Email
        type: string
      - name: address
        label: Address
        type: object
        fields:
          - name: street
            label: Street
            type: string
          - name: city
            label: City
            type: string
          - name: state
            label: State
            type: string
          - name: zip
            label: ZIP Code
            type: string
          - name: maps_url
            label: Google Maps URL
            type: string

  - name: hours
    label: Hours
    type: file
    path: _data/hours.yml
    list: true
    fields:
      - name: day
        label: Day
        type: string
        readonly: true
      - name: abbr
        label: Abbreviation
        type: string
        hidden: true
      - name: time
        label: Hours
        type: string
        description: "e.g. 8am - 5pm or Closed"

  - name: holidays
    label: Holiday Closures
    type: file
    path: _data/holidays.yml
    list: true
    fields:
      - name: holiday
        label: Holiday Name
        type: string
        description: "e.g. Thanksgiving, Christmas Day"
      - name: date
        label: Date
        type: date
      - name: message
        label: Banner Message
        type: string
        description: "Shown in the site banner and hours card on that date"
