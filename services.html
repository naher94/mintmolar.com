---
layout: default
hero_headline: "A full <em>family</em> practice under one roof."
---

{% assign services = site.services | sort: "order" %}
<section class="services-list scaffold-grid">
  {% for service in services %}
    <div class="service-card scaffold-grid-span-full md:scaffold-grid-span-third">
      <h2>{{ service.title }}</h2>
      <p>{{ service.description }}</p>
    </div>
  {% endfor %}
</section>
