{% if page.hero_tag or page.hero_headline or page.hero_subline %}
<section class="hero">
  <div class="scaffold-container hero__inner">

    {% if page.hero_tag %}
      <p class="hero__tag">{{ page.hero_tag }}</p>
    {% endif %}

    {% if page.hero_headline %}
      <h1 class="hero__headline">{{ page.hero_headline | raw }}</h1>
    {% endif %}

  </div>
</section>
{% endif %}
