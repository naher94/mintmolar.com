<header>
  <div class="scaffold-container header__inner">

    <a class="header__logo" href="{{ site.baseurl }}/" aria-label="Mint and Molar - Home">
      {% include mm-logo.svg %}
    </a>

    <nav class="header__nav">
      <a class="header__nav-link" href="{{ site.baseurl }}/">Home</a>
      <a class="header__nav-link" href="{{ site.baseurl }}/team">Team</a>
      <a class="header__nav-link" href="{{ site.baseurl }}/services">Services</a>
    </nav>

    <div class="header__actions">
      <a class="header__phone" href="tel:{{ site.data.contact.phone_link }}">{{ site.data.contact.phone }}</a>
      <!-- TODO update this link -->
      <a class="header__cta" href="{{ site.baseurl }}/contact">Book a visit</a>
      <a class="header__phone-icon" href="tel:{{ site.data.contact.phone_link }}" aria-label="Call us">{% include phone.svg %}</a>
    </div>

  </div>
</header>
